<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mbill 主题色板</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f5f5f5;
        padding: 40px 20px;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        font-size: 28px;
        color: #1a1a1a;
        margin-bottom: 8px;
        font-weight: 700;
      }
      .subtitle {
        text-align: center;
        font-size: 14px;
        color: #888;
        margin-bottom: 40px;
      }
      .theme-section {
        margin-bottom: 36px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .theme-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .theme-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .theme-name {
        font-size: 18px;
        font-weight: 600;
        color: #1a1a1a;
      }
      .theme-value {
        font-size: 13px;
        color: #aaa;
        margin-left: 4px;
      }
      .shade-row {
        display: flex;
        gap: 6px;
      }
      .shade-cell {
        flex: 1;
        text-align: center;
      }
      .shade-block {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        position: relative;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .shade-block:hover {
        transform: scale(1.08);
        z-index: 2;
      }
      .shade-block.primary {
        box-shadow:
          0 0 0 2.5px #fff,
          0 0 0 4.5px #333;
      }
      .shade-label {
        font-size: 11px;
        color: #666;
        margin-top: 6px;
        font-weight: 500;
      }
      .shade-hex {
        font-size: 10px;
        color: #aaa;
        margin-top: 2px;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }
      .col-headers {
        display: flex;
        gap: 6px;
        margin-bottom: 4px;
      }
      .col-header {
        flex: 1;
        text-align: center;
        font-size: 11px;
        color: #bbb;
        font-weight: 600;
      }
      /* 深色模式预览 */
      .dark-preview {
        margin-top: 48px;
      }
      .dark-preview .theme-section {
        background: #1a1a1a;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      }
      .dark-preview .theme-name {
        color: #eee;
      }
      .dark-preview .theme-value {
        color: #666;
      }
      .dark-preview .shade-label {
        color: #999;
      }
      .dark-preview .shade-hex {
        color: #666;
      }
      .dark-preview .col-header {
        color: #555;
      }
      .dark-preview .shade-block.primary {
        box-shadow:
          0 0 0 2.5px #1a1a1a,
          0 0 0 4.5px #888;
      }
      .section-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dark-preview .section-title {
        color: #eee;
      }
      .badge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 500;
      }
      .badge-light {
        background: #f0f0f0;
        color: #666;
      }
      .badge-dark {
        background: #333;
        color: #ccc;
      }
      /* tooltip */
      .tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 100;
        font-family: 'SF Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Mbill 主题色板</h1>
      <p class="subtitle">Theme Color Palette &mdash; 6 个主题 &times; 10 级色阶</p>

      <div class="light-preview" id="light-section"></div>
      <div class="dark-preview" id="dark-section"></div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
      const themes = [
        {
          name: '默认蓝',
          value: 'blue',
          primary: '#1C64FD',
          shades: [
            '#F5F8FF',
            '#E5EDFF',
            '#B8CFFF',
            '#7CA4FF',
            '#4480FF',
            '#1C64FD',
            '#164ED1',
            '#1341AD',
            '#0F3285',
            '#0A235C',
          ],
        },
        {
          name: '活力橙',
          value: 'orange',
          primary: '#FF7D00',
          shades: [
            '#FFF7F0',
            '#FFEAD6',
            '#FFD0A8',
            '#FFB06E',
            '#FF9338',
            '#FF7D00',
            '#D96800',
            '#B35600',
            '#8A4200',
            '#5F2D00',
          ],
        },
        {
          name: '薄荷绿',
          value: 'green',
          primary: '#07C160',
          shades: [
            '#F1FCF6',
            '#DCF7E8',
            '#B4EFD0',
            '#7FE2AF',
            '#42D28A',
            '#07C160',
            '#049F4F',
            '#028241',
            '#016532',
            '#014825',
          ],
        },
        {
          name: '樱花粉',
          value: 'pink',
          primary: '#FF69B4',
          shades: [
            '#FFF2F9',
            '#FFE2F1',
            '#FFC2E3',
            '#FF99D1',
            '#FF7FC2',
            '#FF69B4',
            '#E84E9F',
            '#CC3F8A',
            '#A9336F',
            '#7A2450',
          ],
        },
        {
          name: '紫罗兰',
          value: 'purple',
          primary: '#8A2BE2',
          shades: [
            '#F7F2FF',
            '#EEE2FF',
            '#D9BDFF',
            '#BC8DFF',
            '#A05EFF',
            '#8A2BE2',
            '#7423BF',
            '#5E1D9C',
            '#491679',
            '#321056',
          ],
        },
        {
          name: '朱砂红',
          value: 'red',
          primary: '#FF4757',
          shades: [
            '#FFF3F4',
            '#FFE3E5',
            '#FFC0C6',
            '#FF909A',
            '#FF6672',
            '#FF4757',
            '#DB3445',
            '#B7293A',
            '#931E2E',
            '#6F1421',
          ],
        },
      ]

      function luminance(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255,
          g = parseInt(hex.slice(3, 5), 16) / 255,
          b = parseInt(hex.slice(5, 7), 16) / 255
        const toLinear = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4))
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b)
      }

      function textColorFor(hex) {
        return luminance(hex) > 0.45 ? '#333' : '#fff'
      }

      function renderSection(container, isDark) {
        const title = document.createElement('div')
        title.className = 'section-title'
        title.innerHTML = isDark
          ? '<span class="badge badge-dark">Dark</span> 深色模式预览'
          : '<span class="badge badge-light">Light</span> 亮色模式预览'
        container.appendChild(title)

        themes.forEach((theme) => {
          const section = document.createElement('div')
          section.className = 'theme-section'

          const header = document.createElement('div')
          header.className = 'theme-header'
          header.innerHTML = `<div class="theme-dot" style="background:${theme.primary}"></div><span class="theme-name">${theme.name}</span><span class="theme-value">${theme.value} · P6 ${theme.primary}</span>`
          section.appendChild(header)

          const colHeaders = document.createElement('div')
          colHeaders.className = 'col-headers'
          for (let i = 1; i <= 10; i++) {
            const col = document.createElement('div')
            col.className = 'col-header'
            col.textContent = `P${i}`
            colHeaders.appendChild(col)
          }
          section.appendChild(colHeaders)

          const row = document.createElement('div')
          row.className = 'shade-row'

          theme.shades.forEach((color, i) => {
            const cell = document.createElement('div')
            cell.className = 'shade-cell'

            const block = document.createElement('div')
            block.className = 'shade-block' + (i === 5 ? ' primary' : '')
            block.style.background = color
            block.dataset.hex = color

            const label = document.createElement('div')
            label.className = 'shade-label'
            label.textContent = `primary${i + 1}`

            const hex = document.createElement('div')
            hex.className = 'shade-hex'
            hex.textContent = color

            cell.appendChild(block)
            cell.appendChild(label)
            cell.appendChild(hex)
            row.appendChild(cell)
          })

          section.appendChild(row)
          container.appendChild(section)
        })
      }

      const tooltip = document.getElementById('tooltip')
      document.addEventListener('mousemove', (e) => {
        const block = e.target.closest('.shade-block')
        if (block) {
          tooltip.style.opacity = '1'
          tooltip.textContent = `${block.dataset.hex}  (点击复制)`
          tooltip.style.left = e.clientX + 12 + 'px'
          tooltip.style.top = e.clientY - 36 + 'px'
        } else {
          tooltip.style.opacity = '0'
        }
      })
      document.addEventListener('click', (e) => {
        const block = e.target.closest('.shade-block')
        if (block) {
          navigator.clipboard.writeText(block.dataset.hex)
          tooltip.textContent = '已复制 ✓'
          setTimeout(() => {
            tooltip.textContent = block.dataset.hex
          }, 800)
        }
      })

      renderSection(document.getElementById('light-section'), false)
      renderSection(document.getElementById('dark-section'), true)
    </script>
  </body>
</html>
